// JWorks 10.2.4: first-run UI bootstrap runs independently of the main app bundle.
(async function(){
  try {
    const r = await fetch('/api/setup-needed?bootstrap=' + Date.now(), {cache:'no-store'});
    const n = await r.json();
    if (n && n.needed === true) {
      document.getElementById('authTitle').textContent='Create administrator';
      document.getElementById('authText').textContent='First run: create the administrator account. Choose a password for the administrator account.';
      document.getElementById('authEyebrow').textContent='First-time setup';
      document.getElementById('authForm').dataset.mode='setup';
      document.getElementById('password').minLength=1;
      document.getElementById('password').autocomplete='new-password';
    } else {
      document.getElementById('authForm').dataset.mode='login';
    }
  } catch(e) {
    document.getElementById('authError').textContent='Unable to check first-time setup: '+e.message;
  }
})();
</script><nav id="mobileNav" class="mobile-nav hidden"><button data-mobile-page="dashboard">⌂<span>Home</span></button><button data-mobile-page="today">✓<span>My Work</span></button><button data-mobile-page="inbox">＋<span>Notes</span></button><button data-mobile-page="projects">▣<span>Projects</span></button><button data-mobile-page="settings">⚙<span>More</span></button></nav><script src="/app.js?v=11.3.0"></script></body></html>
